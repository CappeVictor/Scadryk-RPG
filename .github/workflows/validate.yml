name: Validate C# game

on:
  push:
    paths:
      - '*.cs'
      - 'Assets/**'
      - 'Tests/**'
      - 'UnityPort/Tools/Summarize-Playtests.ps1'
      - 'UnityPort/Tools/Test-Summarize-Playtests.ps1'
      - 'Scadryk.csproj'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - '*.cs'
      - 'Assets/**'
      - 'Tests/**'
      - 'UnityPort/Tools/Summarize-Playtests.ps1'
      - 'UnityPort/Tools/Test-Summarize-Playtests.ps1'
      - 'Scadryk.csproj'
      - '.github/workflows/validate.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Validate playtest summary tooling
        shell: pwsh
        run: ./UnityPort/Tools/Test-Summarize-Playtests.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, Node 24
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Scadryk.csproj --configuration Release
      - name: Gameplay smoke tests
        run: dotnet run --project Scadryk.csproj --configuration Release --no-build -- --self-test
      - name: Publish self-contained Windows x64 build
        run: dotnet publish Scadryk.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/Scadryk-win-x64
      - name: Verify published build and assets
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifacts/Scadryk-win-x64/Scadryk.exe')) { throw 'Scadryk.exe is missing from the published build.' }
          $requiredAssets = @('Listener.png', 'PlayerAttack.png', 'StoneGuardian.png', 'StoneGuardianAttack.png', 'NameWeaver.png', 'NameWeaverAttack.png', 'Enemies.png', 'EnemyAttacks.png', 'SpearboundElite.png', 'InkEcho.png', 'DrownedMemory.png', 'EmberWisp.png', 'NameMoth.png', 'MudCantor.png', 'PaperWraith.png', 'SaltEcho.png', 'Bosses.png', 'BossesMidgame.png', 'BossesLate.png', 'BossesFinalWave.png', 'BossesEndgame.png')
          foreach ($asset in $requiredAssets) {
            if (-not (Test-Path "artifacts/Scadryk-win-x64/Assets/$asset")) { throw "Published asset is missing: $asset" }
          }
          & 'artifacts/Scadryk-win-x64/Scadryk.exe' --self-test
      - name: Upload Windows x64 build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: scadryk-win-x64
          path: artifacts/Scadryk-win-x64/
          if-no-files-found: error
          retention-days: 30

